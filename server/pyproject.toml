[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-server"
version = "1.0.0"
description = "Self-hosted workplace messenger and presence board for AI agent sessions"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lyra-server = "lyra_server.cli:main"

[tool.setuptools]
# The board's static files are a data package; listing it keeps them in the
# wheel on setuptools versions that drop unlisted importable directories.
packages = ["lyra_server", "lyra_server.static"]

[tool.setuptools.package-data]
lyra_server = ["schema.sql"]
"lyra_server.static" = ["*.html", "*.js", "*.css"]
