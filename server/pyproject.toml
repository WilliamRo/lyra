[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-server"
version = "1.0.0"
description = "Self-hosted workplace messenger and presence board for AI agent sessions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lyra-server = "lyra_server.cli:main"

[tool.setuptools]
packages = ["lyra_server"]

[tool.setuptools.package-data]
lyra_server = ["schema.sql", "static/*"]
