name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run server unit and integration tests
        run: python3 -B -m unittest discover -s server/tests -p "test_*.py" -v

      - name: Run lyra-link connector tests
        run: python3 -B -m unittest discover -s connectors/lyra-link/scripts -p "test_*.py" -v

      - name: Run export script tests
        run: python3 -B -m unittest discover -s scripts -p "test_*.py" -v
